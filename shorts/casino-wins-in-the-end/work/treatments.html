<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1a191e;width:1500px;height:760px;display:flex;gap:40px;align-items:center;justify-content:center;font:20px system-ui;color:#ccc}
.c{text-align:center} .lab{margin-top:18px}
.plain img,.grade img{width:400px;height:520px;object-fit:cover;display:block;border-radius:6px}
.grade{position:relative;width:400px;height:520px;overflow:hidden;border-radius:6px}
.grade img{filter:grayscale(1) contrast(1.06) brightness(.92)}
.grade::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 75% at 50% 45%,rgba(17,8,26,0) 40%,rgba(17,8,26,.55) 100%),rgba(56,16,77,.08)}
.snap{background:#f4f1ea;padding:16px 16px 54px;box-shadow:0 22px 40px rgba(0,0,0,.55);transform:rotate(-4deg)}
.snap .ph{position:relative;width:368px;height:470px;overflow:hidden}
.snap img{width:100%;height:100%;object-fit:cover;filter:contrast(1.12) saturate(1.18) sepia(.16) brightness(1.04)}
.snap .fl{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(255,255,255,.14) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.snap .lk{position:absolute;inset:0;mix-blend-mode:screen;background:linear-gradient(100deg,rgba(255,120,40,.38) 0%,rgba(255,80,60,.12) 18%,rgba(0,0,0,0) 34%)}
.snap .st{position:absolute;right:18px;bottom:14px;font:700 30px/1 "Courier New",monospace;color:#ff8a2a;text-shadow:0 0 6px rgba(255,120,30,.85)}
</style></head><body>
<div class="c plain"><img src="../photos/messi-wc2022-portrait-02.jpg"><div class="lab">1 · Real photo, untouched</div></div>
<div class="c"><div class="grade"><img src="../photos/messi-wc2022-portrait-02.jpg"></div><div class="lab">2 · Kanz grade (engine CSS, never repainted)</div></div>
<div class="c"><div class="snap"><div class="ph"><img src="../photos/messi-wc2022-portrait-02.jpg"><div class="fl"></div><div class="lk"></div><div class="st">'22 11 26</div></div></div><div class="lab">3 · Disposable-camera print (K.snap35)</div></div>
</body></html>
